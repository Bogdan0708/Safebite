name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web
          npm ci --prefix functions

      - name: Guardrail — no production project id in tracked files
        run: |
          if git grep -n "safebite-production-13ba1" -- ':!SafeBite/**' ':!*.md' ':!docs/**' ':!.github/workflows/ci.yml' ':!web/src/config/firebaseEnv.ts' ':!web/src/config/firebaseEnv.test.ts'; then
            echo "Production project id found in tracked files"; exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (web)
        run: npm run test:unit

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Functions + rules tests (emulators)
        run: npm run emu:test

      - name: Install Playwright Chromium
        run: cd web && npx playwright install --with-deps chromium

      - name: Browser tests (emulators)
        run: npm run emu:e2e

      - name: Build (compile check, unvalidated)
        run: npm run build

      - name: Deployable build is rejected without Firebase configuration
        run: |
          if npm --prefix web run build; then
            echo "Deployable build succeeded without configuration — validator is broken"; exit 1
          fi
          echo "Validator rejected the unconfigured deployable build as expected"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
